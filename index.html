<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTS Arirang Tour - Countdown MorumBIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Cinzel:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Montserrat', sans-serif;
      color: #ffffff;
      background: #0b0714;
      overflow-x: hidden;
      position: relative;
    }

    /* Fundo Temático com Gradiente BTS (Borahae / Purple Rain) & Padrão Arirang */
    .bg-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: 
        radial-gradient(circle at 20% 20%, rgba(157, 78, 221, 0.35) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(123, 44, 191, 0.4) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(36, 0, 70, 0.8) 0%, #090312 100%);
      overflow: hidden;
    }

    /* Brilho dinâmico de fundo */
    .glow-sphere {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(199, 125, 255, 0.15) 0%, rgba(0,0,0,0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: pulseGlow 6s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
      100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.9; }
    }

    /* Card Principal */
    .card {
      position: relative;
      z-index: 2;
      background: rgba(18, 10, 31, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(224, 170, 255, 0.2);
      border-radius: 24px;
      padding: 3rem 2rem;
      width: 90%;
      max-width: 850px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                  0 0 30px rgba(157, 78, 221, 0.2);
    }

    /* Símbolo do BTS (SVG) */
    .bts-logo {
      width: 50px;
      height: auto;
      margin-bottom: 1.5rem;
      fill: #e0aaff;
      filter: drop-shadow(0 0 8px rgba(224, 170, 255, 0.8));
    }

    /* Header e Títulos */
    .subtitle {
      font-size: 0.95rem;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #c77dff;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #ffffff 0%, #e0aaff 50%, #9d4edd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 20px rgba(157, 78, 221, 0.3);
    }

    .location {
      font-size: 1.1rem;
      color: #e0aaff;
      letter-spacing: 2px;
      margin-bottom: 2.5rem;
      font-weight: 400;
    }

    .location span {
      color: #ffffff;
      font-weight: 700;
    }

    /* Grid do Cronômetro */
    .timer-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.2rem;
      margin-bottom: 2.5rem;
    }

    .time-box {
      background: rgba(36, 0, 70, 0.5);
      border: 1px solid rgba(199, 125, 255, 0.25);
      border-radius: 16px;
      padding: 1.5rem 0.5rem;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .time-box:hover {
      transform: translateY(-5px);
      border-color: rgba(224, 170, 255, 0.6);
      box-shadow: 0 10px 20px rgba(157, 78, 221, 0.3);
    }

    .number {
      font-size: 3.5rem;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(180deg, #ffffff 30%, #e0aaff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-variant-numeric: tabular-nums;
    }

    .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #c77dff;
      margin-top: 0.75rem;
      font-weight: 700;
    }

    /* Rodapé com mensagem temáticas */
    .footer-text {
      font-size: 0.9rem;
      letter-spacing: 2px;
      color: #b8c0ff;
      text-transform: uppercase;
    }

    .purple-heart {
      color: #9d4edd;
      display: inline-block;
      animation: heartBeat 1.5s infinite ease-in-out;
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }

    /* Responsividade */
    @media (max-width: 768px) {
      h1 { font-size: 2.2rem; }
      .subtitle { font-size: 0.8rem; letter-spacing: 4px; }
      .location { font-size: 0.95rem; }
      .timer-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
      .number { font-size: 2.8rem; }
      .card { padding: 2rem 1.2rem; }
    }
  </style>
</head>
<body>

  <div class="bg-container">
    <div class="glow-sphere"></div>
  </div>

  <main class="card">
    <!-- BTS Logo (Representação Vetorizada Estilizada) -->
    <svg class="bts-logo" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 0 L45 10 L45 130 L10 140 Z" />
      <path d="M90 0 L55 10 L55 130 L90 140 Z" />
    </svg>

    <div class="subtitle">WORLD TOUR 2026</div>
    <h1>ARIRANG</h1>
    <div class="location">SÃO PAULO &bull; <span>SÃO PAULO MORUMBIS</span> &bull; 28/10</div>

    <div class="timer-grid">
      <div class="time-box">
        <div class="number" id="days">00</div>
        <div class="label">Dias</div>
      </div>
      <div class="time-box">
        <div class="number" id="hours">00</div>
        <div class="label">Horas</div>
      </div>
      <div class="time-box">
        <div class="number" id="minutes">00</div>
        <div class="label">Minutos</div>
      </div>
      <div class="time-box">
        <div class="number" id="seconds">00</div>
        <div class="label">Segundos</div>
      </div>
    </div>

    <div class="footer-text">
      APOBANGPO <span class="purple-heart">💜</span> ARMY
    </div>
  </main>

  <script>
    // Data do evento: 28 de Outubro às 20:00 (Horário padrão para shows grandes)
    const targetYear = new Date().getFullYear();
    let eventDate = new Date(`October 28, ${targetYear} 20:00:00`).getTime();

    // Se o dia 28/10 deste ano já passou na data do sistema, ajusta para o próximo ano
    if (new Date().getTime() > eventDate) {
      eventDate = new Date(`October 28, ${targetYear + 1} 20:00:00`).getTime();
    }

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = eventDate - now;

      if (distance < 0) {
        document.querySelector('.timer-grid').innerHTML = `
          <div style="grid-column: 1 / -1; font-size: 1.8rem; font-weight: 700; color: #e0aaff; padding: 1rem 0;">
            O SHOW COMEÇOU! WELCOME TO ARIRANG TOUR! 💜
          </div>
        `;
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById('days').innerText = String(days).padStart(2, '0');
      document.getElementById('hours').innerText = String(hours).padStart(2, '0');
      document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
      document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>

</body>
</html>
